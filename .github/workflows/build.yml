name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# contents: publishing releases and the build report; id-token + attestations: the signed record of which
# code and which build made each APK ("gh attestation verify Delphis.apk -R HiramRG/Delphis").
permissions:
  contents: write
  id-token: write
  attestations: write

# Every third-party step is pinned to an exact commit (the version is in the comment), so a changed or
# compromised tag can't slip into Delphis' builds. Dependabot (.github/dependabot.yml) proposes updates.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      # Unit tests, including the layout check (LayoutCheckTest): every screen drawn at the Thor's two sizes,
      # a phone and a tablet; it fails (and nothing is published) if any words are cut off, run off the screen,
      # overlap, or a label wraps to more than two lines.
      - name: Unit tests and layout check
        timeout-minutes: 25
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest 2>&1 | tee test.log
      - name: Layout check summary
        if: always()
        run: |
          if [ -f app/build/layout-check/summary.md ]; then cat app/build/layout-check/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Layout check screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-check
          path: app/build/layout-check/
          if-no-files-found: ignore
      - name: Build APKs
        run: |
          set -o pipefail
          # The beta branch builds the Beta channel (versionName 1.0.N-beta; Settings → Updates shows it).
          CHANNEL=stable
          if [ "$GITHUB_REF" = refs/heads/beta ]; then CHANNEL=beta; fi
          gradle :app:assembleDebug :app:assembleRelease -PversionCode=${{ github.run_number }} -Pchannel=$CHANNEL 2>&1 | tee build.log
      # Signs both APKs. The keys are in signing/delphis-keys.p12.gpg, encrypted with the
      # SIGNING_PASSWORD secret (see signing/README.md). "delphis" is the original key and
      # "delphis-2" the current one; the rotation lineage lets installed copies update to the new key.
      - name: Sign APKs
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir dist
          if [ -z "${SIGNING_PASSWORD:-}" ]; then
            if { [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/beta ]; } && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo "::error::The SIGNING_PASSWORD secret isn't set, so this build can't be released." | tee signing.log
              exit 1
            fi
            echo "SIGNING_PASSWORD isn't available; this build is not signed." | tee signing.log
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Delphis-unsigned.apk
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/keys.p12"
          trap 'rm -f "$KS" "$RUNNER_TEMP/lineage"' EXIT
          gpg --quiet --batch --yes --pinentry-mode loopback --decrypt --passphrase-fd 0 -o "$KS" signing/delphis-keys.p12.gpg <<< "$SIGNING_PASSWORD"
          OLD=(--ks "$KS" --ks-type PKCS12 --ks-key-alias delphis --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD)
          NEW=(--ks "$KS" --ks-type PKCS12 --ks-key-alias delphis-2 --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD)
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage" --old-signer "${OLD[@]}" --new-signer "${NEW[@]}"
          sign() {
            "$BT/apksigner" sign "${OLD[@]}" --next-signer "${NEW[@]}" --lineage "$RUNNER_TEMP/lineage" \
              --rotation-min-sdk-version 28 --out "$2" "$1"
          }
          sign app/build/outputs/apk/release/app-release-unsigned.apk dist/Delphis.apk
          sign app/build/outputs/apk/debug/app-debug.apk dist/Delphis-debug.apk
          rm -f dist/*.idsig
          {
            echo "build-tools: $(basename "$BT")"
            "$BT/apksigner" verify -v --print-certs dist/Delphis.apk
            echo "--- lineage"
            "$BT/apksigner" lineage --in dist/Delphis.apk --print-certs -v
          } 2>&1 | tee signing.log
      # What people can check a download against: the APK's SHA-256 and the signing certificate's fingerprint
      # (also saved as Delphis-SHA256SUMS.txt in the release).
      - name: Checksums
        id: sums
        run: |
          set -euo pipefail
          cd dist
          sha256sum Delphis*.apk > Delphis-SHA256SUMS.txt
          echo "apk=$(sha256sum Delphis.apk 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # The key rotation lineage lists the original key first and the current one last.
          mapfile -t CERTS < <(sed -n '/--- lineage/,$p' ../signing.log 2>/dev/null | grep -i "certificate SHA-256 digest" | sed 's/.*digest: *//' | awk '!seen[$0]++')
          if [ ${#CERTS[@]} -ge 2 ]; then CERT="${CERTS[-1]}\` (current key; earlier key \`${CERTS[0]})"
          elif [ ${#CERTS[@]} -eq 1 ]; then CERT="${CERTS[0]}"
          else CERT=$(grep -m1 -i "certificate SHA-256 digest" ../signing.log 2>/dev/null | sed 's/.*digest: *//' || true); fi
          echo "cert=${CERT:-not signed}" >> "$GITHUB_OUTPUT"
          cat Delphis-SHA256SUMS.txt
      - name: Proof of origin (build provenance)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        # Never holds back a release if GitHub's signing service is having trouble (shown as a warning instead).
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Delphis*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delphis-apk
          path: dist/Delphis*
      # Publish the newest build as a GitHub Release so the APK can be downloaded from any
      # browser or the GitHub app (Releases section on the repo's main page).
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Delphis (latest build)
          body: |
            Install **Delphis.apk** on your AYN Thor, or use *Settings → Updates* inside Delphis.

            versionCode: ${{ github.run_number }}
            commit: ${{ github.sha }}

            **Check your download** (see [SECURITY.md](https://github.com/HiramRG/Delphis/blob/main/SECURITY.md)):
            * Delphis.apk SHA-256: `${{ steps.sums.outputs.apk }}`
            * Signing certificate SHA-256: `${{ steps.sums.outputs.cert }}`
            * Proof it was built here from this commit: `gh attestation verify Delphis.apk -R HiramRG/Delphis`
          prerelease: false
          make_latest: true
          files: dist/Delphis*
      - name: Move the "latest" tag to this commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
      - name: Remove old files from the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest --json assets -q '.assets[].name'); do
            case "$asset" in Delphis*) ;; *) gh release delete-asset latest "$asset" -y ;; esac
          done
      # Beta channel: builds pushed to the beta branch go to the "beta" pre-release, which Delphis
      # installs when Settings → Updates → Update channel is Beta. Stable ("latest") only changes from main.
      - name: Publish "beta" release
        if: github.ref == 'refs/heads/beta' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: beta
          target_commitish: ${{ github.sha }}
          name: Delphis (beta build)
          body: |
            Beta build for testing. Install **Delphis.apk**, or choose *Beta* in *Settings → Updates → Update channel* inside Delphis.

            versionCode: ${{ github.run_number }}
            commit: ${{ github.sha }}

            **Check your download** (see [SECURITY.md](https://github.com/HiramRG/Delphis/blob/main/SECURITY.md)):
            * Delphis.apk SHA-256: `${{ steps.sums.outputs.apk }}`
            * Signing certificate SHA-256: `${{ steps.sums.outputs.cert }}`
            * Proof it was built here from this commit: `gh attestation verify Delphis.apk -R HiramRG/Delphis`
          prerelease: true
          make_latest: false
          files: dist/Delphis*
      - name: Move the "beta" tag to this commit
        if: github.ref == 'refs/heads/beta' && github.event_name != 'pull_request'
        run: |
          # (refs/tags/…: a branch is also called "beta")
          git tag -f beta
          git push -f origin refs/tags/beta
      - name: Remove old files from the beta release
        if: github.ref == 'refs/heads/beta' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view beta --json assets -q '.assets[].name'); do
            case "$asset" in Delphis*) ;; *) gh release delete-asset beta "$asset" -y ;; esac
          done
      # Save the result and any errors to a hidden ref (refs/ci/<branch>; not shown on the site) so
      # they can be read with plain git: git fetch origin refs/ci/<branch>.
      - name: Save build report
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/report && cd /tmp/report && git init -q
          printf 'status: %s\nsha: %s\nrun: %s\n' "${{ job.status }}" "${{ github.sha }}" "${{ github.run_number }}" > status.txt
          cp "$GITHUB_WORKSPACE/signing.log" . 2>/dev/null || true
          for f in test build; do
            if [ -f "$GITHUB_WORKSPACE/$f.log" ]; then
              grep -E "^e: |error:|FAILED|Exception|expected:|What went wrong" -A3 "$GITHUB_WORKSPACE/$f.log" | head -400 > "$f-errors.txt" || true
              tail -150 "$GITHUB_WORKSPACE/$f.log" > "$f-tail.txt"
            fi
          done
          grep -l "<failure" -r "$GITHUB_WORKSPACE/app/build/test-results" 2>/dev/null | head -5 | while read x; do cp "$x" .; done || true
          cp "$GITHUB_WORKSPACE/app/build/layout-check/summary.md" layout-check.md 2>/dev/null || true
          # The layout check's screenshots too (CI artifacts can't be downloaded everywhere).
          if [ -d "$GITHUB_WORKSPACE/app/build/layout-check" ]; then mkdir -p shots && cp -r "$GITHUB_WORKSPACE/app/build/layout-check/." shots/; fi
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "build report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/ci/${GITHUB_REF_NAME}
