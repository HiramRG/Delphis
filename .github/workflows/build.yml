name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease -PversionCode=${{ github.run_number }}
      - name: Rename APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/Delphis.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Delphis-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: delphis-apk
          path: dist/*.apk
      # Publish the newest build as a GitHub Release so the APK can be downloaded from any
      # browser or the GitHub app (Releases section on the repo's main page).
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Delphis (latest build)
          body: |
            Install **Delphis.apk** on your AYN Thor, or use *Settings → Updates* inside Delphis.

            versionCode: ${{ github.run_number }}
            commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: dist/*.apk
      - name: Move the "latest" tag to this commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Remove old files from the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest --json assets -q '.assets[].name'); do
            case "$asset" in Delphis*) ;; *) gh release delete-asset latest "$asset" -y ;; esac
          done
