name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest 2>&1 | tee test.log
      - name: Build APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease -PversionCode=${{ github.run_number }} 2>&1 | tee build.log
      # Signs both APKs. The keys are in signing/delphis-keys.p12.gpg, encrypted with the
      # SIGNING_PASSWORD secret (see signing/README.md). "delphis" is the original key and
      # "delphis-2" the current one; the rotation lineage lets installed copies update to the new key.
      - name: Sign APKs
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir dist
          if [ -z "${SIGNING_PASSWORD:-}" ]; then
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo "::error::The SIGNING_PASSWORD secret isn't set, so this build can't be released." | tee signing.log
              exit 1
            fi
            echo "SIGNING_PASSWORD isn't available; this build is not signed." | tee signing.log
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Delphis-unsigned.apk
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/keys.p12"
          trap 'rm -f "$KS" "$RUNNER_TEMP/lineage"' EXIT
          gpg --quiet --batch --yes --pinentry-mode loopback --decrypt --passphrase-fd 0 -o "$KS" signing/delphis-keys.p12.gpg <<< "$SIGNING_PASSWORD"
          OLD=(--ks "$KS" --ks-type PKCS12 --ks-key-alias delphis --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD)
          NEW=(--ks "$KS" --ks-type PKCS12 --ks-key-alias delphis-2 --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD)
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage" --old-signer "${OLD[@]}" --new-signer "${NEW[@]}"
          sign() {
            "$BT/apksigner" sign "${OLD[@]}" --next-signer "${NEW[@]}" --lineage "$RUNNER_TEMP/lineage" \
              --rotation-min-sdk-version 28 --out "$2" "$1"
          }
          sign app/build/outputs/apk/release/app-release-unsigned.apk dist/Delphis.apk
          sign app/build/outputs/apk/debug/app-debug.apk dist/Delphis-debug.apk
          rm -f dist/*.idsig
          {
            echo "build-tools: $(basename "$BT")"
            "$BT/apksigner" verify -v --print-certs dist/Delphis.apk
            echo "--- lineage"
            "$BT/apksigner" lineage --in dist/Delphis.apk --print-certs -v
          } 2>&1 | tee signing.log
      - uses: actions/upload-artifact@v4
        with:
          name: delphis-apk
          path: dist/*.apk
      # Publish the newest build as a GitHub Release so the APK can be downloaded from any
      # browser or the GitHub app (Releases section on the repo's main page).
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Delphis (latest build)
          body: |
            Install **Delphis.apk** on your AYN Thor, or use *Settings → Updates* inside Delphis.

            versionCode: ${{ github.run_number }}
            commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: dist/*.apk
      - name: Move the "latest" tag to this commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Remove old files from the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest --json assets -q '.assets[].name'); do
            case "$asset" in Delphis*) ;; *) gh release delete-asset latest "$asset" -y ;; esac
          done
      # Save the result and any errors to a hidden ref (refs/ci/<branch>; not shown on the site) so
      # they can be read with plain git: git fetch origin refs/ci/<branch>.
      - name: Save build report
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/report && cd /tmp/report && git init -q
          printf 'status: %s\nsha: %s\nrun: %s\n' "${{ job.status }}" "${{ github.sha }}" "${{ github.run_number }}" > status.txt
          cp "$GITHUB_WORKSPACE/signing.log" . 2>/dev/null || true
          for f in test build; do
            if [ -f "$GITHUB_WORKSPACE/$f.log" ]; then
              grep -E "^e: |error:|FAILED|Exception|expected:|What went wrong" -A3 "$GITHUB_WORKSPACE/$f.log" | head -400 > "$f-errors.txt" || true
              tail -150 "$GITHUB_WORKSPACE/$f.log" > "$f-tail.txt"
            fi
          done
          grep -l "<failure" -r "$GITHUB_WORKSPACE/app/build/test-results" 2>/dev/null | head -5 | while read x; do cp "$x" .; done || true
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "build report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/ci/${GITHUB_REF_NAME}
