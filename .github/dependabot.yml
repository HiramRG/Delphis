# Dependabot: proposes updates (as pull requests) when a library or a build step Delphis uses has a
# newer version, and right away when one has a known security problem. Each proposal runs the full
# build and layout check before anything is merged.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      libraries:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      build-steps:
        patterns: ["*"]
