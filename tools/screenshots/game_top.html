<html><head><link rel="stylesheet" href="common.css"></head><body>
<div class="stripes" style="width:700px;height:393px;padding:12px 18px;display:flex;gap:16px">
 <div style="width:190px;display:flex;flex-direction:column;gap:6px">
  <div class="acc" style="font-weight:800;font-size:14px">◀ Back</div>
  <div style="aspect-ratio:.72;width:170px;border-radius:14px;border:3px solid #34BEED;padding:3px"><div class="cover" style="height:100%;background:#2E6B3F;font-size:14px">Metroid Prime Trilogy</div></div>
  <div style="font-weight:800;font-size:16px">Metroid Prime Trilogy</div><div class="dim" style="font-size:11px">Wii · Played today · 6 h played</div></div>
 <div style="flex:1;display:flex;flex-direction:column;gap:8px">
  <div class="card" style="flex:1;padding:12px;display:flex;flex-direction:column;gap:8px">
   <div class="dim" style="font-size:11px;font-weight:800;letter-spacing:1px">CONTROLS</div>
   <div style="font-size:16px;font-weight:800">Precision gyro <span class="org">(experimental)</span></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:1">
    <div class="card" style="border-radius:14px;display:flex;align-items:center;gap:8px;padding:8px"><span class="badge" style="width:26px;height:26px;border-radius:13px;background:#E5484D;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800">A</span><b style="font-size:13px">Fire</b></div>
    <div class="card" style="border-radius:14px;display:flex;align-items:center;gap:8px;padding:8px"><span style="width:26px;height:26px;border-radius:13px;background:#F5A524;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800">B</span><b style="font-size:13px">Jump</b></div>
    <div class="card" style="border-radius:14px;display:flex;align-items:center;gap:8px;padding:8px"><span style="height:26px;padding:0 8px;border-radius:13px;background:#B38CFF;color:#fff;display:inline-flex;align-items:center;font-weight:800;font-size:11px">Gyro</span><b style="font-size:13px">Aim</b></div>
    <div class="card" style="border-radius:14px;display:flex;align-items:center;gap:8px;padding:8px"><span style="height:26px;padding:0 8px;border-radius:13px;background:#5C8DF6;color:#fff;display:inline-flex;align-items:center;font-weight:800;font-size:11px">L2</span><b style="font-size:13px">Lock on</b></div>
   </div></div>
  <div style="display:flex;gap:8px;align-items:center"><span class="chip on">✓ Remember</span><span style="flex:1"></span><span class="btn">Ⓧ Edit</span><span class="btn p">Ⓐ Play</span></div>
  <div class="hint">Ⓐ Play · ✚ choose · Ⓧ Edit · Ⓨ Remember · Ⓑ Back · or tap a style on the bottom screen</div>
 </div></div></body></html>
