<html><head><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="dark.css"></head><body>
<div class="dstripes" style="width:451px;height:393px;display:flex;flex-direction:column">
 <div style="height:22px;background:#15181C;border-bottom:1px solid #2E343C;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;font-weight:800">
  <span style="color:#5CCBF2">Delphis</span><span style="font-size:12px">9:58</span>
  <span style="display:flex;align-items:center;gap:5px"><span style="width:20px;height:10px;border:1.5px solid #A3ADB8;border-radius:2px;padding:1.5px;display:inline-block"><span style="display:block;height:100%;width:78%;background:#E8ECF0"></span></span>78%</span></div>
 <div style="flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:7px">
  <div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px;color:#A3ADB8">←</span>
   <div style="flex:1"><div style="font-weight:800;font-size:14px">Super Mario Galaxy 2</div><div style="font-size:11px;color:#A3ADB8">Precision gyro <span style="color:#F08A24;font-weight:800">(experimental)</span></div></div>
   <span class="dbtn" style="height:30px;width:30px;padding:0">☀</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
   <div class="dcard" style="padding:10px;display:flex;gap:10px;align-items:center"><span class="badge" style="background:#E5484D">A</span><b style="font-size:14px">Jump</b></div>
   <div class="dcard" style="padding:10px;display:flex;gap:10px;align-items:center"><span class="badge" style="background:#F5A524">B</span><b style="font-size:14px">Crouch</b></div>
   <div class="dcard" style="padding:10px;display:flex;gap:10px;align-items:center"><span class="badge" style="background:#34BEED">X</span><b style="font-size:14px">Spin</b></div>
   <div class="dcard" style="padding:10px;display:flex;gap:10px;align-items:center"><span class="badge" style="background:#B38CFF;width:auto;padding:0 8px;border-radius:15px;font-size:12px">Gyro</span><b style="font-size:14px">Aim pointer</b></div>
  </div>
  <div class="dcard" style="padding:8px 10px;font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:5px 10px">
   <span><b style="color:#7FB2FF">R1</b> &nbsp;Hold: pause gyro aim</span><span><b style="color:#7FB2FF">R2</b> &nbsp;Shoot star bits</span>
   <span><b style="color:#7FB2FF">L2</b> &nbsp;Center camera</span><span><b style="color:#7FB2FF">R3</b> &nbsp;Recenter pointer</span>
   <span><b style="color:#7FB2FF">Start</b> &nbsp;Pause</span><span><b style="color:#7FB2FF">Y</b> &nbsp;Spin</span></div>
  <div style="flex:1"></div>
  <div style="display:flex;gap:8px"><span class="dbtn" style="flex:1">Change controls</span><span class="dbtn" style="flex:1">Edit preset</span><span class="dbtn" style="flex:1">Main menu</span></div>
 </div>
</div></body></html>
